apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argocd
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway-api-config
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  path: ./kubernetes/infrastructure/argocd
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
