apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mlflow
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway-api-config
    # The artifact store is the mlflow-artifacts bucket in Garage.
    - name: ml-storage
  interval: 10m
  retryInterval: 2m
  # MLflow's pod waits for its s3-credentials Secret, which
  # scripts/bootstrap-dev.sh writes with scripts/ml-credentials.py.
  timeout: 15m
  path: ./kubernetes/infrastructure/mlflow
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
