apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./kubernetes/infrastructure/cert-manager/controller
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
