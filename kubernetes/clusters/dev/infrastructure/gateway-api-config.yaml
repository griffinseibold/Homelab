apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-config
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway-api-controller
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/infrastructure/gateway-api/overlays/dev
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # The lan listener's host address (envoy-proxy.yaml). Optional so a
  # missing ConfigMap falls back to loopback instead of blocking the Gateway.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: homelab-host
        optional: true

