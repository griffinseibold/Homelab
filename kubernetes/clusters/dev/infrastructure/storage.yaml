apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/infrastructure/storage
  # A StorageClass in use must not disappear because a file moved.
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
