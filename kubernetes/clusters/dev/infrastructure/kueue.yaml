apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kueue
  namespace: flux-system
spec:
  dependsOn:
    # The chart's ServiceMonitor CRD comes from kube-prometheus-stack.
    - name: monitoring
  interval: 10m
  retryInterval: 2m
  # Ready once the controller has issued its webhook certificate and passes
  # its readiness check, so the queues below can be validated.
  timeout: 10m
  path: ./kubernetes/infrastructure/kueue/controller
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
