apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gpu
  namespace: flux-system
spec:
  # No dependencies: the device plugin only needs the kubelet, and the
  # dashboard is a ConfigMap Grafana picks up whenever it starts.
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/infrastructure/gpu
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
