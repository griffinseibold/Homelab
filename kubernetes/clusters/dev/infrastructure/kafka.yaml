apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kafka
  namespace: flux-system
spec:
  dependsOn:
    # ServiceMonitor and PrometheusRule CRDs come from kube-prometheus-stack.
    - name: monitoring
  interval: 10m
  retryInterval: 2m
  # The first start downloads the JMX agent, pulls the broker image and
  # formats the volume.
  timeout: 15m
  path: ./kubernetes/infrastructure/kafka
  # No postBuild substitution: the broker's start command uses the shell
  # variable ${AGENT_PATH}, which Flux would otherwise replace with nothing.
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
