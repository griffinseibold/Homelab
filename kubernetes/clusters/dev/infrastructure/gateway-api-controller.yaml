apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-controller
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./kubernetes/infrastructure/gateway-api/controller
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system

