apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  releaseName: kube-prometheus-stack
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    grafana:
      enabled: true
      # The bundled dashboards persist through provisioning, but user-created
      # dashboards live in Grafana's database, so keep it on a volume. The
      # Recreate strategy avoids a rolling-update deadlock on the RWO claim.
      deploymentStrategy:
        type: Recreate
      persistence:
        enabled: true
        storageClassName: local-path
        size: 1Gi
      grafana.ini:
        server:
          root_url: http://grafana.localhost:8080/
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
    # k3s runs these control-plane components inside its single process and
    # binds their metrics to localhost (and etcd is not used), so these
    # scrape targets could never be reached and would show as down.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    prometheus-node-exporter:
      # GPU metrics for the AMD GPU dashboard (kubernetes/infrastructure/gpu).
      # The drm collector (off by default) reads the amdgpu driver's busy
      # percentage and VRAM use from sysfs; hwmon, on by default, gives its
      # temperature and power. AMD's device-metrics-exporter would need an
      # Instinct or Radeon AI card. Setting extraArgs replaces the chart's
      # defaults, so its two filesystem exclusions are repeated here.
      extraArgs:
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
        - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$
        - --collector.drm
    prometheus:
      prometheusSpec:
        # Discover ServiceMonitors and PodMonitors from every namespace
        # instead of only those labeled with this Helm release.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        retention: 7d
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
