apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  releaseName: kube-prometheus-stack
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    grafana:
      enabled: true
      # The bundled dashboards persist through provisioning, but user-created
      # dashboards live in Grafana's database, so keep it on a volume. The
      # Recreate strategy avoids a rolling-update deadlock on the RWO claim.
      deploymentStrategy:
        type: Recreate
      persistence:
        enabled: true
        storageClassName: standard
        size: 1Gi
      grafana.ini:
        server:
          root_url: http://grafana.localhost:8080/
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
    # These control-plane components bind to localhost inside Kind nodes, so
    # their scrape targets can never be reached and would show as down.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    prometheus:
      prometheusSpec:
        # Discover ServiceMonitors and PodMonitors from every namespace
        # instead of only those labeled with this Helm release.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        retention: 7d
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
