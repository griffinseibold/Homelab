apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  hostnames:
    - grafana.localhost
    - grafana.lab.internal
  parentRefs:
    - name: homelab
      namespace: gateway-system
      sectionName: http
    - name: homelab
      namespace: gateway-system
      sectionName: lan
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
