apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: gateway-system
spec:
  gatewayClassName: homelab
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.homelab/access: public
    # Home-network HTTPS. scripts/bootstrap-dev.sh publishes this listener on
    # the host's LAN address only when LAN_ADDRESS is set. Namespaces must
    # opt in separately, so loopback-only services stay off the network.
    - name: lan
      protocol: HTTPS
      port: 443
      hostname: "*.lab.internal"
      tls:
        mode: Terminate
        certificateRefs:
          - name: lab-internal-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.homelab/lan: "true"
