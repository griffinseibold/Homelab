apiVersion: batch/v1
kind: Job
metadata:
  name: garage-setup
  labels:
    app.kubernetes.io/name: garage-setup
  annotations:
    # A Job's pod template cannot be changed in place. The script ConfigMap
    # name carries a content hash, so editing setup.py changes the template;
    # this tells Flux to replace the Job, which reruns the idempotent setup.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  # The script waits for Garage itself, so retries only cover genuine
  # errors. A failed Job stays failed until it is deleted or changed; Flux
  # recreates a deleted Job on its next sync.
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage-setup
    spec:
      restartPolicy: Never
      # It talks only to Garage's admin API, never to Kubernetes.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          # The same pinned image as the LLM demand controller.
          image: python:3.13.16-alpine3.24
          command: ["python3", "-I", "-u", "/app/setup.py"]
          env:
            - name: GARAGE_ADMIN_URL
              value: http://garage-admin.ml-storage.svc:3903
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage
                  key: GARAGE_ADMIN_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: garage-setup-script
