apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: chat
spec:
  interval: 30m
  releaseName: open-webui
  chart:
    spec:
      chart: open-webui
      version: 16.3.0
      sourceRef:
        kind: HelmRepository
        name: open-webui
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    # The platform's llama-server is the only backend; no bundled Ollama or
    # pipelines server.
    ollama:
      enabled: false
    pipelines:
      enabled: false
    openaiBaseApiUrl: http://llama-server.llm.svc.cluster.local/v1
    # llama-server does not check API keys; the chart requires a value.
    openaiApiKey: homelab-local
    # Chat is reachable from the home network, so only the first account
    # (the administrator) may register. Open WebUI keeps this setting in its
    # database once saved; an existing install may also need it switched off
    # under Admin Panel > Settings > General.
    extraEnvVars:
      - name: ENABLE_SIGNUP
        value: "false"
    persistence:
      enabled: true
      size: 2Gi
    route:
      enabled: true
      hostnames:
        - chat.localhost
        - chat.lab.internal
      parentRefs:
        - name: homelab
          namespace: gateway-system
          sectionName: http
        - name: homelab
          namespace: gateway-system
          sectionName: lan
