apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-cd
  namespace: argocd
spec:
  interval: 30m
  releaseName: argo-cd
  chartRef:
    kind: OCIRepository
    name: argo-cd
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    global:
      domain: argocd.localhost
    configs:
      params:
        # The loopback-only development Gateway serves plain HTTP.
        server.insecure: true
      cm:
        url: http://argocd.localhost:8080
