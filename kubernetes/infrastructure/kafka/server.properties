# Single-node Apache Kafka in KRaft mode: one process is both the broker and
# its own controller, with no ZooKeeper. Reference for every setting:
# https://kafka.apache.org/43/configuration/broker-configs/
#
# Applications reach it at kafka.kafka.svc.cluster.local:9092 (PLAINTEXT,
# inside the cluster only) and create their own topics; see
# docs/operations.md, "Streaming and batch queueing".

############################# Roles and quorum #############################

process.roles=broker,controller
node.id=1
# A static one-voter quorum, as in the official image's own single-node
# configuration. It needs no `kafka-storage.sh format --standalone`
# bookkeeping and there is never a second controller to add.
controller.quorum.voters=1@127.0.0.1:9093

############################# Listeners #############################

# Clients on 9092 from any pod. The controller listener stays on the pod's
# loopback: only this process talks to its own controller.
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://127.0.0.1:9093
# The address clients are told to reconnect to after bootstrapping. It must
# be the Service name, not the pod's, so it survives pod replacement.
advertised.listeners=PLAINTEXT://kafka.kafka.svc.cluster.local:9092
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

############################# Topics #############################

# Applications create their topics explicitly at startup (replication factor
# 1). Auto-creation would turn a typo in a topic name into a silent new topic.
auto.create.topics.enable=false
num.partitions=1
# One broker can hold only one copy of anything. Kafka's own internal topics
# (consumer offsets, transactions, share groups) default to three copies and
# would never be created here without these.
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1

############################# Storage and retention #############################

# A subdirectory of the volume (mounted at /var/lib/kafka/data), so the
# verified JMX agent in /var/lib/kafka/data/jmx-agent (fetch-jmx-agent.py)
# can sit beside it: Kafka refuses unknown directories inside a log dir.
log.dirs=/var/lib/kafka/data/logs
# Sized for a 20 Gi volume and one user. Kafka deletes a partition's oldest
# segment once it is older than 7 days OR the partition exceeds 2 GiB,
# whichever comes first. The size limit is per partition, not per topic: a
# topic with three partitions can hold up to 6 GiB. A topic can set its own
# retention.ms and retention.bytes when an application creates it.
log.retention.hours=168
log.retention.bytes=2147483648
# Retention removes whole segments only. 256 MiB segments (the default is
# 1 GiB) keep a partition close to its limit instead of up to 1 GiB over.
log.segment.bytes=268435456
log.retention.check.interval.ms=300000
num.recovery.threads.per.data.dir=2
