apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  releaseName: cert-manager
  chartRef:
    kind: OCIRepository
    name: cert-manager
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    # The chart templates its CRDs rather than shipping them in crds/, and
    # keeps them on uninstall so certificates are not deleted with it.
    crds:
      enabled: true
