apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - service-monitor.yaml
  - prometheus-rule.yaml
  # Starts and stops the server on demand and switches the lab mode's chat.
  - demand
configMapGenerator:
  - name: llama-server-dashboard
    files:
      - llama-server.json=dashboard.json
    options:
      # The Grafana sidecar watches data updates; keep one dashboard ConfigMap.
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        # The llm Flux Kustomization substitutes ${MODELS_DIR}; Grafana's own
        # $__rate_interval variables in the dashboard must be left alone.
        kustomize.toolkit.fluxcd.io/substitute: disabled
