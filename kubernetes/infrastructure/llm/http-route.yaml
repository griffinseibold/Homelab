apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  labels:
    app.kubernetes.io/name: llama-server
spec:
  hostnames:
    - llm.localhost
  parentRefs:
    - name: homelab
      namespace: gateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Envoy Gateway's default 15s request timeout cuts off long generations,
      # especially Qwen3 thinking before it answers. Match client timeouts.
      timeouts:
        request: 300s
      backendRefs:
        - name: llama-server
          port: 80
