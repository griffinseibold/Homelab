apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  labels:
    app.kubernetes.io/name: llama-server
spec:
  hostnames:
    - llm.localhost
  parentRefs:
    - name: homelab
      namespace: gateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: llama-server
          port: 80
