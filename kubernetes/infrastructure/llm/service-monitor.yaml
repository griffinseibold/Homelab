apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llama-server
  labels:
    app.kubernetes.io/name: llama-server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-server
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
