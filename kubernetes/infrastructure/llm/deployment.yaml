apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  labels:
    app.kubernetes.io/name: llama-server
spec:
  # One GPU, one server. Additional models become additional deployments.
  # replicas is deliberately absent: the LLM demand controller (demand/)
  # scales this between 0 and 1, and a value here would make Flux's
  # server-side apply reset it on every sync. On a fresh install (and once on
  # the upgrade that removed the field) the Deployment starts at the
  # Kubernetes default of one replica; the controller stops it after its idle
  # grace if nothing needs it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # The device plugin passes the GPU's /dev/kfd and /dev/dri nodes into
        # the container with their host ownership: renderD* belongs to the
        # host's render group and card* to video. The pod needs those group
        # IDs, which differ between distributions, so bootstrap-dev.sh reads
        # them from the host into the homelab-host ConfigMap.
        supplementalGroups:
          - ${RENDER_GID}
          - ${VIDEO_GID}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10731
          args:
            - --model
            - /models/Qwen3-8B-Q4_K_M.gguf
            - --n-gpu-layers
            - "99"
            - --ctx-size
            - "8192"
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --metrics
          ports:
            - name: http
              containerPort: 8080
          # No privileged mode or host device mounts: AMD's device plugin
          # allocates the GPU and mounts /dev/kfd plus the GPU's
          # /dev/dri/card* and /dev/dri/renderD* nodes, which is what the
          # Vulkan backend opens. With one GPU, this server and any training
          # job queue for it through the scheduler.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 12Gi
              amd.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        # The host directory that download-models.sh fills and bootstrap
        # verifies, mounted read-only. MODELS_DIR comes from the homelab-host
        # ConfigMap through Flux substitution.
        - name: models
          hostPath:
            path: "${MODELS_DIR}"
            type: Directory
