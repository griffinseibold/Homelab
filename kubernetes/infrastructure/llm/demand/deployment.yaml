apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-demand
  labels:
    app.kubernetes.io/name: llm-demand
spec:
  # Two controllers would only repeat the same decision, but Recreate keeps
  # exactly one writer during an update.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-demand
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-demand
    spec:
      serviceAccountName: llm-demand
      securityContext:
        runAsNonRoot: true
        # The image's "nobody" user; the script needs no home or files.
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # Standard library only, so the official image runs it unmodified.
          image: python:3.13.16-alpine3.24
          # -I ignores PYTHON* variables and the script directory on the import
          # path; -u sends each log line straight to the pod log.
          command: ["python3", "-I", "-u", "/app/controller.py"]
          env:
            - name: POLL_SECONDS
              value: "15"
            # How long the LLM keeps running after the last request goes
            # away, so a restarting or redeploying application does not
            # unload a model that takes minutes to load again.
            - name: IDLE_GRACE_SECONDS
              value: "300"
            # A brand-new chat install keeps running this long so its volume
            # binds before it is stopped (see controller.py).
            - name: CHAT_SETTLE_SECONDS
              value: "180"
            - name: PORT
              value: "8080"
          ports:
            - name: metrics
              containerPort: 8080
          # Liveness only checks that the loop is still turning; a failing API
          # server shows in readiness and metrics instead of restart loops.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: llm-demand-script
