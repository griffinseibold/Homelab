apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm
resources:
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - service-monitor.yaml
configMapGenerator:
  # The name gets a content hash, so editing the script rolls the controller.
  - name: llm-demand-script
    files:
      - controller.py
    options:
      annotations:
        # Keep Flux's ${MODELS_DIR} substitution away from the script source.
        kustomize.toolkit.fluxcd.io/substitute: disabled
