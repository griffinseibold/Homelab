---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: homelab-dev

# The worker mounts expose the host's AMD GPU (/dev/dri) and the model
# weights directory (populated by scripts/download-models.sh) to workloads.
# Model files live on the host so they survive complete cluster rebuilds.
# bootstrap-dev.sh replaces the quoted MODELS_DIR marker with a safely
# escaped absolute path. Create this cluster through that script.
# It also replaces the quoted LAN address marker with LAN_ADDRESS, or with
# 127.0.0.1 when home-network access is off. Kind fixes port mappings at creation, so
# changing that address requires recreating the cluster.
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
        protocol: TCP
      # HTTPS for the Gateway's lan listener, on one private IPv4 address.
      - containerPort: 30443
        hostPort: 443
        listenAddress: "__LAN_ADDRESS__"
        protocol: TCP

  - role: worker
    labels:
      homelab.local/llm-capable: "true"
    extraMounts:
      - hostPath: "__MODELS_DIR__"
        containerPath: /models
        readOnly: true
      - hostPath: /dev/dri
        containerPath: /dev/dri

  - role: worker
    labels:
      homelab.local/llm-capable: "true"
    extraMounts:
      - hostPath: "__MODELS_DIR__"
        containerPath: /models
        readOnly: true
      - hostPath: /dev/dri
        containerPath: /dev/dri
