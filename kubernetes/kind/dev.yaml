---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: homelab-dev

# The worker mounts expose the host's AMD GPU (/dev/dri) and the model
# weights directory (populated by scripts/download-models.sh) to workloads.
# Model files live on the host so they survive complete cluster rebuilds.
# bootstrap-dev.sh replaces the quoted MODELS_DIR marker with a safely
# escaped absolute path. Create this cluster through that script.
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
        protocol: TCP

  - role: worker
    labels:
      homelab.local/llm-capable: "true"
    extraMounts:
      - hostPath: "__MODELS_DIR__"
        containerPath: /models
        readOnly: true
      - hostPath: /dev/dri
        containerPath: /dev/dri

  - role: worker
    labels:
      homelab.local/llm-capable: "true"
    extraMounts:
      - hostPath: "__MODELS_DIR__"
        containerPath: /models
        readOnly: true
      - hostPath: /dev/dri
        containerPath: /dev/dri
