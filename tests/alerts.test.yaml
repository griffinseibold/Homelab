# scripts/test-alerts.py extracts the Kubernetes rule spec and supplies rule_files.
evaluation_interval: 1m
tests:
  - name: healthy and idle produces no alerts
    interval: 1m
    input_series:
      - series: 'up{namespace="llm", service="llama-server", endpoint="http"}'
        values: '1+0x15'
      - series: 'llamacpp:requests_deferred{namespace="llm", service="llama-server"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: LlamaServerUnavailable
        exp_alerts: []
      - eval_time: 12m
        alertname: LlamaServerQueueBacklog
        exp_alerts: []

  - name: failed scrapes receive ten minutes to recover
    interval: 1m
    input_series:
      - series: 'up{namespace="llm", service="llama-server", endpoint="http"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: LlamaServerUnavailable
        exp_alerts: []
      - eval_time: 10m
        alertname: LlamaServerUnavailable
        exp_alerts:
          - exp_labels: &llm_labels
              severity: warning
              namespace: llm
              service: llama-server
            exp_annotations: &unavailable_annotations
              summary: LLM metrics have been unavailable for 10 minutes
              description: Check the llama-server pod, model and GPU mounts, startup logs, and ServiceMonitor. Normal model loading and brief restarts are allowed 10 minutes to recover.

  - name: missing discovery also alerts
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 10m
        alertname: LlamaServerUnavailable
        exp_alerts:
          - exp_labels: *llm_labels
            exp_annotations: *unavailable_annotations

  - name: brief outage recovers without firing
    interval: 1m
    input_series:
      - series: 'up{namespace="llm", service="llama-server", endpoint="http"}'
        values: '0+0x8 1+0x6'
    alert_rule_test:
      - eval_time: 8m
        alertname: LlamaServerUnavailable
        exp_alerts: []
      - eval_time: 12m
        alertname: LlamaServerUnavailable
        exp_alerts: []

  - name: a healthy replacement prevents an outage alert
    interval: 1m
    input_series:
      - series: 'up{namespace="llm", service="llama-server", endpoint="http", pod="old"}'
        values: '0+0x15'
      - series: 'up{namespace="llm", service="llama-server", endpoint="http", pod="new"}'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: LlamaServerUnavailable
        exp_alerts: []

  - name: brief request queue produces no alert
    interval: 1m
    input_series:
      - series: 'up{namespace="llm", service="llama-server", endpoint="http"}'
        values: '1+0x15'
      - series: 'llamacpp:requests_deferred{namespace="llm", service="llama-server"}'
        values: '3+0x5 0+0x9'
    alert_rule_test:
      - eval_time: 5m
        alertname: LlamaServerQueueBacklog
        exp_alerts: []
      - eval_time: 12m
        alertname: LlamaServerQueueBacklog
        exp_alerts: []

  - name: a sustained backlog alerts after ten minutes and clears on recovery
    interval: 1m
    input_series:
      - series: 'up{namespace="llm", service="llama-server", endpoint="http"}'
        values: '1+0x20'
      - series: 'llamacpp:requests_deferred{namespace="llm", service="llama-server"}'
        values: '1+0x14 0+0x5'
    alert_rule_test:
      - eval_time: 9m
        alertname: LlamaServerQueueBacklog
        exp_alerts: []
      - eval_time: 10m
        alertname: LlamaServerQueueBacklog
        exp_alerts:
          - exp_labels: *llm_labels
            exp_annotations:
              summary: LLM requests have been queued for 10 minutes
              description: The server has had a continuous request backlog. Inspect the LLM inference dashboard and request volume before adjusting concurrency, token limits, or GPU capacity.
      - eval_time: 16m
        alertname: LlamaServerQueueBacklog
        exp_alerts: []
