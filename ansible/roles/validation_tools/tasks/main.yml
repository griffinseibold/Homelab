---
# python3-yaml is already a dependency of the ansible apt package, but
# scripts/validate-manifests.py imports it directly, so install it explicitly.
- name: Install packaged validation tools
  ansible.builtin.apt:
    name:
      - shellcheck
      - python3-yaml
    state: present

- name: Download kubeconform archive
  ansible.builtin.get_url:
    url: "https://github.com/yannh/kubeconform/releases/download/{{ kubeconform_version }}/kubeconform-linux-amd64.tar.gz"
    dest: /tmp/kubeconform.tar.gz
    checksum: "sha256:{{ kubeconform_sha256 }}"
    mode: "0644"

- name: Install kubeconform
  ansible.builtin.unarchive:
    src: /tmp/kubeconform.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include:
      - kubeconform
    mode: "0755"

- name: Download Prometheus archive for promtool
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: /tmp/prometheus.tar.gz
    checksum: "sha256:{{ prometheus_sha256 }}"
    mode: "0644"

- name: Install promtool
  ansible.builtin.unarchive:
    src: /tmp/prometheus.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts:
      - --strip-components=1
    include:
      - "prometheus-{{ prometheus_version }}.linux-amd64/promtool"
    mode: "0755"
