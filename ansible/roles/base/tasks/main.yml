---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - htop
      - jq
      - unzip
    state: present

# Ubuntu's default inotify limits are too low for the kubelet and Alloy log
# tailing that centralized logging relies on, once many pods run on one host.
- name: Raise inotify limits for log tailing
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-homelab-inotify.conf
    mode: "0644"
    content: |
      fs.inotify.max_user_watches = 524288
      fs.inotify.max_user_instances = 512
  register: inotify_sysctl

# Kind needed net.ipv4.ip_nonlocal_bind so Docker could bind LAN_ADDRESS
# before DHCP assigned it. k3s publishes the Gateway with packet forwarding
# rules instead of listening sockets, so nothing binds the address and the
# setting is no longer needed. It takes effect for a running kernel at the
# next reboot.
- name: Remove the Kind-era non-local bind setting
  ansible.builtin.file:
    path: /etc/sysctl.d/99-homelab-lan.conf
    state: absent

- name: Apply sysctl settings
  ansible.builtin.command:
    cmd: sysctl --system
  when: inotify_sysctl.changed

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download GitHub CLI repository signing key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"

- name: Add GitHub CLI apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/github-cli.list
    mode: "0644"
    content: |
      deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main

- name: Update apt cache after adding GitHub CLI repository
  ansible.builtin.apt:
    update_cache: true

- name: Install GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: present
