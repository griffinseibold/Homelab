---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - htop
      - jq
      - unzip
    state: present

# Kind nodes share the host kernel, and Ubuntu's default inotify limits are
# too low for the kubelet log tailing that centralized logging relies on.
# These are the values recommended by Kind's known-issues documentation.
- name: Raise inotify limits for Kind log tailing
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-homelab-inotify.conf
    mode: "0644"
    content: |
      fs.inotify.max_user_watches = 524288
      fs.inotify.max_user_instances = 512
  register: inotify_sysctl

# A cluster created with LAN_ADDRESS publishes the Gateway on that one address.
# Docker starts Kind's nodes at boot once the network is "online", which can
# happen before DHCP assigns the IPv4 address; this lets the port binding
# succeed anyway instead of leaving the control-plane node stopped.
- name: Allow Docker to bind the LAN address before DHCP assigns it
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-homelab-lan.conf
    mode: "0644"
    content: |
      net.ipv4.ip_nonlocal_bind = 1
  register: lan_sysctl

- name: Apply sysctl settings
  ansible.builtin.command:
    cmd: sysctl --system
  when: inotify_sysctl.changed or lan_sysctl.changed

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download GitHub CLI repository signing key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"

- name: Add GitHub CLI apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/github-cli.list
    mode: "0644"
    content: |
      deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main

- name: Update apt cache after adding GitHub CLI repository
  ansible.builtin.apt:
    update_cache: true

- name: Install GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: present
