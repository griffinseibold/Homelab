---
- name: Install Kubernetes repository dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - bash-completion
    state: present

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Kubernetes repository signing key
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/Release.key
    dest: /tmp/kubernetes-release.key
    mode: "0644"

- name: Convert Kubernetes signing key to GPG keyring
  ansible.builtin.command:
    cmd: >
      gpg --dearmor
      --output /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      /tmp/kubernetes-release.key
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Ensure Kubernetes keyring is readable
  ansible.builtin.file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    mode: "0644"

- name: Add Kubernetes apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    mode: "0644"
    content: |
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/ /

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install kubectl
  ansible.builtin.apt:
    name: kubectl
    state: present

- name: Install Helm repository dependencies
  ansible.builtin.apt:
    name:
      - curl
      - gpg
      - apt-transport-https
    state: present

- name: Download Helm repository signing key
  ansible.builtin.get_url:
    url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
    dest: /tmp/helm-signing-key.asc
    mode: "0644"
  register: helm_key_download

- name: Read Helm signing key fingerprint
  ansible.builtin.command:
    cmd: gpg --show-keys --with-colons /tmp/helm-signing-key.asc
  register: helm_key_info
  changed_when: false

- name: Verify Helm signing key fingerprint
  ansible.builtin.assert:
    that:
      - "'DDF78C3E6EBB2D2CC223C95C62BA89D07698DBC6' in helm_key_info.stdout"
    fail_msg: "Helm repository signing key fingerprint does not match expected value"

- name: Convert Helm signing key to GPG keyring
  ansible.builtin.shell:
    cmd: >
      gpg --dearmor
      --yes
      --output /usr/share/keyrings/helm.gpg
      /tmp/helm-signing-key.asc
  when: helm_key_download.changed

- name: Add Helm apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/helm-stable-debian.list
    mode: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main

- name: Update apt cache after adding Helm repository
  ansible.builtin.apt:
    update_cache: true

- name: Install Helm
  ansible.builtin.apt:
    name: helm
    state: present

- name: Install kind
  ansible.builtin.get_url:
    url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
    dest: /usr/local/bin/kind
    mode: "0755"

