name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/workflows/validate.yml
      - name: Install validation tools
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install ansible-core==2.21.3 PyYAML==6.0.3
          sudo apt-get update
          sudo apt-get install --yes shellcheck

          tools_dir="${RUNNER_TEMP}/homelab-tools"
          mkdir -p "${tools_dir}"
          cd "${tools_dir}"

          curl --fail --location --silent --show-error --retry 3 \
            --output kubectl https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl
          curl --fail --location --silent --show-error --retry 3 \
            --output kubectl.sha256 https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl.sha256
          printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum --check
          chmod +x kubectl

          curl --fail --location --silent --show-error --retry 3 \
            --output kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo 'c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  kubeconform.tar.gz' | sha256sum --check
          tar -xzf kubeconform.tar.gz kubeconform

          curl --fail --location --silent --show-error --retry 3 \
            --output prometheus.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz
          echo 'f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d  prometheus.tar.gz' | sha256sum --check
          tar -xzf prometheus.tar.gz --strip-components=1 prometheus-3.14.0.linux-amd64/promtool
          echo "${tools_dir}" >> "${GITHUB_PATH}"
      - name: Run validation without a cluster
        run: ./scripts/validate.sh
