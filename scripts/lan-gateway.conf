# nginx configuration for the LAN gateway container that bootstrap-dev.sh
# runs when LAN_ADDRESS is set. It forwards raw TCP from the host's LAN
# address to the Gateway's HTTPS NodePort; TLS still terminates at Envoy.
# __GATEWAY_NODE__ is replaced with the Kind control-plane container name.
worker_processes 1;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

stream {
  # Docker's embedded DNS. Resolving per connection follows the node if a
  # restart gives the control-plane container a different address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 443;

    # Private networks only, so a mistaken router port forward still cannot
    # reach the homelab from the internet.
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    set $gateway __GATEWAY_NODE__:30443;
    proxy_pass $gateway;
  }
}
